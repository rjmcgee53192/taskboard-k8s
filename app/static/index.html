<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 0.9rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #888; }
  .del { background: none; border: none; color: #c00; }
  .note { color: #666; font-size: 0.85rem; margin-top: 2rem; }
</style>
</head>
<body>
<h1>Taskboard</h1>
<form id="add-form">
  <input type="text" id="title" placeholder="New task..." maxlength="200" required>
  <button type="submit">Add</button>
</form>
<ul id="tasks"></ul>
<p class="note">Demo app for a Kubernetes learning project. Tasks are stored in memory and disappear on restart.</p>
<script>
async function load() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  const ul = document.getElementById('tasks');
  ul.innerHTML = '';
  for (const t of tasks) {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = t.done;
    cb.onchange = async () => {
      await fetch('/api/tasks/' + t.id, { method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({done: cb.checked}) });
      load();
    };
    const span = document.createElement('span');
    span.textContent = t.title;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'delete';
    del.onclick = async () => {
      await fetch('/api/tasks/' + t.id, { method: 'DELETE' });
      load();
    };
    li.append(cb, span, del);
    ul.appendChild(li);
  }
}
document.getElementById('add-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('title');
  const res = await fetch('/api/tasks', { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: input.value}) });
  if (res.ok) { input.value = ''; load(); }
};
load();
</script>
</body>
</html>
